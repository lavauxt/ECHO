input:
  bamdir: "./data/GOM"
  bed: "./data/GOM/GOM.bed"
  fasta: "./data/REF/hg19.fa"
  rbams: null

output:
  dir: "./result_GOMv2_regen"
  prefix: "GOM"

settings:
  # General QC
  modechrom: "A"
  min_corr: 0.98
  min_cov: 100
  min_total_reads: 300000
  max_exon_cv: 0.5

  # CNV calling – ExomeDepth parameters
  transition_probability: 0.0001
  expected_CNV_length: 50000
  n_bins_reduced: 10000
  phi_bins: 1
  formula: "cbind(test, reference) ~ 1"
  # data: (optional) path to covariate file – not used by default

  # Confidence thresholds
  score_high_corr: 0.985
  score_med_corr: 0.95
  score_high_refs: 3
  score_med_refs: 2
  score_low_ratio_low: 0.75
  score_low_ratio_high: 1.25
  score_high_ratio_low: 0.70
  score_high_ratio_high: 1.30
  score_med_ratio_low: 0.60
  score_med_ratio_high: 1.40
  score_low_confidence_genes: ["PMS2", "SMN1", "CYP2D6", "HBA1", "HBA2", "STRC", "CYP21A2", "GBA1", "CFTR"]

# -------------------------------
# BED PREPROCESSING (optional)
# -------------------------------
# Remove or comment out this entire section if you do not need BED preprocessing.
bed_preprocess:
  # Processing mode: "NO", "STANDARD", or "REGEN"
  bed_process: "REGEN"
  
  # For "STANDARD" mode: path to a file listing panel BED files (one per line).
  # If omitted or empty, the input BED is simply cleaned (first 4 columns, exon_sep applied).
  
  # For "REGEN" mode: RefSeq annotation or genome version
  genome_version: "hg19"       # "hg19" or "hg38"
  
  # Common options for all modes:
  unknown_gene: false           # if true, keep unknown genes as "Unknown"
  # gene_list_restrict: ["ARID1A", "TP53"]   # restrict to these genes
  # chr_list_restrict: ["chrY", "chrM"]      # exclude these chromosomes
  exon_sep: "_"                 # split gene column and keep first part
  gene_field_index: 3           # index of gene column name after split
  # customexon: false             # add a Custom.Exon column (5th column)
  customexon: true
  # Coordinate handling (applied after preprocessing)
  bed_zero_based: true          # convert BED start from 0‑based to 1‑based
  skip_invalid_intervals: true  # remove intervals that cannot be extracted from FASTA
